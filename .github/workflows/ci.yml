name: "Test"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]
env:
  CARGO_TERM_COLOR: always
jobs:
  svelte-test:
    name: "Check, Lint, Test, Build"
    runs-on: ubuntu-latest

    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
      - name: "Install Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.3"
      # Restore the dependency cache keyed on deno.lock. Falls back to a
      # fresh `deno cache` only on a cache miss.
      - name: "Cache Deno dependencies"
        id: deno-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: ${{ runner.os }}-deno-deps-${{ hashFiles('deno.lock') }}
      - name: "Restore dependencies"
        if: steps.deno-deps.outputs.cache-hit != 'true'
        run: deno install --entrypoint src/main.ts
      - name: "Type check"
        run: deno task check
      - name: "Lint"
        run: deno task lint
      - name: "Test"
        run: deno task test
      - name: "Build"
        run: deno task build
      - name: "Upload Svelte coverage to Codecov"
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: svelte
          name: svelte-coverage
