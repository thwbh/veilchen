# Veilchen Dependabot Configuration
# Automated dependency updates and security scanning.
#
# Note on auto-merge: Dependabot has no auto-merge setting in this file. To
# auto-merge (e.g. low-severity/patch updates), add a separate GitHub Actions
# workflow that runs `gh pr merge --auto` on `dependabot/*` PRs, plus enable
# "Allow auto-merge" + branch protection in repo settings.

version: 2
updates:
  # Deno dependencies (deno.lock is the source of truth)
  - package-ecosystem: "deno"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 10
    reviewers:
      - "thwbh"
    assignees:
      - "thwbh"
    labels:
      - "devops"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      time: "10:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 10
    reviewers:
      - "thwbh"
    assignees:
      - "thwbh"
    labels:
      - "devops"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # All GitHub Actions updates in a single PR.
      github-actions:
        patterns:
          - "*"
